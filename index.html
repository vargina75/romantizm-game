<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РОМАНТИЗМ | Обучающая игра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8dcc8 100%);
            color: #3a2a1a;
            overflow-x: hidden;
            min-height: 100vh;
            font-size: 18px;
            line-height: 1.6;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(139, 90, 43, 0.15);
            border: 2px solid #c9a96e;
        }

        .header h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #5c3a21;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 1.4rem;
            color: #8b6f47;
            font-style: italic;
            letter-spacing: 1px;
        }

        .progress-container {
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 2px solid #c9a96e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(139, 90, 43, 0.1);
        }

        .progress-label {
            color: #5c3a21;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e8dcc8;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #c9a96e;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a96e, #b8956a, #a07840);
            width: 0%;
            transition: width 0.5s ease;
        }
